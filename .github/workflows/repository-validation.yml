name: Repository validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate original content, guides, links, metadata and sensitive patterns
        run: python3 scripts/check_repository.py
      - name: Verify that broken links, unsafe paths and credentials fail validation
        run: python3 -m unittest discover -s tests -v
